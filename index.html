<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dodge the asteroid</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fdfdfb;
      overflow: hidden;
      font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-bar {
      position: fixed;
      top: 12px;
      right: 16px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .pill-btn {
      background: #fff;
      border: 3px solid #2b7a78;
      border-radius: 12px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      color: #2b7a78;
      cursor: pointer;
      box-shadow: 2px 3px 0 #2b7a78;
    }
    .pill-btn:active {
      transform: translate(1px, 2px);
      box-shadow: 1px 1px 0 #2b7a78;
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(253, 253, 251, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    #overlay h1 {
      font-size: clamp(34px, 6vw, 56px);
      color: #7b4bb7;
      margin: 0 0 12px;
      text-shadow: 2px 2px 0 #d8c7f0;
      transform: rotate(-1.5deg);
    }
    #overlay p {
      font-size: 18px;
      color: #3a5a58;
      margin: 6px 0;
    }
    #startBtn {
      margin-top: 22px;
      background: #6ee755;
      border: 4px solid #7b4bb7;
      border-radius: 16px;
      padding: 14px 36px;
      font-family: inherit;
      font-size: 24px;
      font-weight: bold;
      color: #3b1d63;
      cursor: pointer;
      box-shadow: 4px 5px 0 #7b4bb7;
    }
    #startBtn:active {
      transform: translate(2px, 3px);
      box-shadow: 2px 2px 0 #7b4bb7;
    }
  </style>
</head>
<body>
  <div id="ui-bar">
    <button class="pill-btn" id="shipToggleBtn">Ship: Teal</button>
    <button class="pill-btn" id="soundBtn">Sound: ON</button>
  </div>

  <div id="overlay">
    <h1>Dodge the asteroid</h1>
    <p id="statusText">Use Left / Right arrows or tap the on-screen buttons!</p>
    <p id="finalScoreText" style="display:none; font-size:24px; color:#e66c37; font-weight:bold;"></p>
    <button id="startBtn">PLAY</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const statusText = document.getElementById("statusText");
    const finalScoreText = document.getElementById("finalScoreText");
    const shipToggleBtn = document.getElementById("shipToggleBtn");
    const soundBtn = document.getElementById("soundBtn");

    let W = 0, H = 0, dpr = 1;
    let gameRunning = false;
    let score = 0;
    let bestScore = Number(localStorage.getItem("dodge_asteroid_best") || 0);
    let soundOn = true;
    let shipStyle = 0; // 0 = Teal saucer with thruster lines, 1 = Purple orb with top dome

    const keys = { left: false, right: false };
    let pointerLeft = false;
    let pointerRight = false;

    const player = {
      x: 0,
      y: 0,
      r: 32,
      speed: 440
    };

    let asteroids = [];
    let particles = [];
    let spawnTimer = 0;
    let lastTime = 0;

    // Web Audio API simple sound effects
    let audioCtx = null;
    function playTone(freq, type, duration, vol = 0.12) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.35), audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      player.y = getGroundY() - 56;
      if (!gameRunning) {
        player.x = W / 2;
      } else {
        player.x = Math.max(player.r + 20, Math.min(W - player.r - 20, player.x));
      }
    }
    window.addEventListener("resize", resize);

    function getGroundY() {
      return H - Math.max(70, H * 0.11);
    }

    function getButtonRects() {
      const btnW = Math.min(82, W * 0.16);
      const btnH = btnW * 1.25;
      const y = getGroundY() - btnH - 22;
      return {
        left: { x: Math.max(24, W * 0.12), y, w: btnW, h: btnH },
        right: { x: W - Math.max(24, W * 0.12) - btnW, y, w: btnW, h: btnH }
      };
    }

    // Spawn asteroids inspired by the 4 hand-drawn designs in the sketch
    function spawnAsteroid() {
      const type = Math.floor(Math.random() * 4);
      const scale = 0.8 + Math.random() * 0.45;
      const r = 24 * scale;
      const margin = r + 24;
      const x = margin + Math.random() * (W - margin * 2);
      const baseSpeed = 230 + Math.min(340, score * 14);
      const vy = baseSpeed * (0.85 + Math.random() * 0.4);
      asteroids.push({ x, y: -90, r, vy, type, wobble: Math.random() * Math.PI * 2 });
    }

    function createExplosion(x, y) {
      const colors = ["#7b4bb7", "#6ee755", "#2d9c95", "#f07c41", "#f6d54a"];
      for (let i = 0; i < 36; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 80 + Math.random() * 320;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          r: 4 + Math.random() * 6,
          color: colors[i % colors.length],
          life: 0.7 + Math.random() * 0.4
        });
      }
    }

    function resetGame() {
      score = 0;
      asteroids = [];
      particles = [];
      spawnTimer = 0.3;
      player.x = W / 2;
      player.y = getGroundY() - 56;
      gameRunning = true;
      overlay.style.display = "none";
      playTone(520, "triangle", 0.18, 0.12);
    }

    function gameOver() {
      gameRunning = false;
      createExplosion(player.x, player.y);
      playTone(150, "sawtooth", 0.45, 0.2);
      const finalVal = Math.floor(score);
      if (finalVal > bestScore) {
        bestScore = finalVal;
        localStorage.setItem("dodge_asteroid_best", String(bestScore));
      }
      setTimeout(() => {
        statusText.textContent = "Asteroid hit! Ready to dodge again?";
        finalScoreText.style.display = "block";
        finalScoreText.textContent = `Score: ${finalVal}  |  Best: ${bestScore}`;
        startBtn.textContent = "PLAY AGAIN";
        overlay.style.display = "flex";
      }, 450);
    }

    // Hand-drawn marker stroke helper
    function markerBar(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x - w / 2, y, w, h, w / 2);
      ctx.fill();
    }

    function drawAsteroid(a, t) {
      const pulse = Math.sin(t * 14 + a.wobble) * 5;
      ctx.save();
      ctx.translate(a.x, a.y);
      const s = a.r / 24;
      ctx.scale(s, s);

      if (a.type === 0) {
        // Purple block asteroid with tall neon-green and teal flames
        markerBar(-11, -78 - pulse, 10, 62 + pulse, "#7ce846");
        markerBar(0, -90 + pulse * 0.6, 11, 74 - pulse * 0.6, "#2c9e96");
        markerBar(11, -74 - pulse * 0.8, 10, 58 + pulse * 0.8, "#7ce846");
        ctx.fillStyle = "#7b4bb7";
        ctx.beginPath();
        ctx.roundRect(-22, -20, 44, 40, 12);
        ctx.fill();
        ctx.fillStyle = "#2b7a78";
        ctx.beginPath();
        ctx.arc(0, 2, 10, 0, Math.PI * 2);
        ctx.fill();
      } else if (a.type === 1) {
        // Orange core asteroid with yellow & dark-green flames
        markerBar(-12, -56 - pulse * 0.7, 9, 42 + pulse * 0.7, "#2d6a3e");
        markerBar(0, -68 + pulse, 10, 54 - pulse, "#f7dc4f");
        markerBar(12, -54 - pulse * 0.6, 9, 40 + pulse * 0.6, "#2d6a3e");
        ctx.fillStyle = "#ee7b45";
        ctx.beginPath();
        ctx.arc(0, 0, 21, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2d6a3e";
        ctx.beginPath();
        ctx.arc(2, 0, 9, 0, Math.PI * 2);
        ctx.fill();
      } else if (a.type === 2) {
        // Purple oval asteroid with tall teal & orange trail
        markerBar(-11, -76 + pulse, 10, 60 - pulse, "#2c9e96");
        markerBar(0, -70 - pulse, 10, 54 + pulse, "#ee7b45");
        markerBar(11, -78 + pulse * 0.8, 10, 62 - pulse * 0.8, "#2c9e96");
        ctx.fillStyle = "#7b4bb7";
        ctx.beginPath();
        ctx.ellipse(0, 2, 24, 19, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2c9e96";
        ctx.beginPath();
        ctx.arc(0, -8, 8, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Small purple orb with teal/orange/teal triple streaks
        markerBar(-13, -64 - pulse, 8, 42 + pulse, "#2c9e96");
        markerBar(0, -72 + pulse, 9, 48 - pulse, "#ee7b45");
        markerBar(13, -60 - pulse * 0.7, 8, 38 + pulse * 0.7, "#2c9e96");
        ctx.fillStyle = "#7b4bb7";
        ctx.beginPath();
        ctx.arc(0, 4, 16, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawPlayer(t) {
      ctx.save();
      ctx.translate(player.x, player.y);
      const bob = Math.sin(t * 6) * 2.5;
      ctx.translate(0, bob);

      if (shipStyle === 0) {
        // Teal saucer ship with twin vertical stabilizer lines (from drawing bottom-center)
        ctx.strokeStyle = "#2b7a78";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-22, -52);
        ctx.lineTo(-18, -10);
        ctx.moveTo(20, -52);
        ctx.lineTo(22, -10);
        ctx.stroke();

        ctx.fillStyle = "#48b5ae";
        ctx.strokeStyle = "#2b7a78";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(0, 6, 32, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else {
        // Purple pod ship with teal core and purple top bracket (from drawing bottom-right-center)
        ctx.strokeStyle = "#7b4bb7";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(-28, -22);
        ctx.lineTo(-24, -42);
        ctx.lineTo(24, -42);
        ctx.lineTo(26, -20);
        ctx.stroke();

        ctx.fillStyle = "#48b5ae";
        ctx.beginPath();
        ctx.roundRect(-11, -40, 22, 22, 6);
        ctx.fill();

        ctx.fillStyle = "#7b4bb7";
        ctx.beginPath();
        ctx.arc(0, 4, 28, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawSketchControls() {
      const { left, right } = getButtonRects();
      ctx.save();
      ctx.strokeStyle = "#2b7a78";
      ctx.lineWidth = 4.5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      // Left control box + hand-drawn left triangle
      ctx.fillStyle = (keys.left || pointerLeft) ? "rgba(72, 181, 174, 0.25)" : "rgba(255,255,255,0.6)";
      ctx.beginPath();
      ctx.roundRect(left.x, left.y, left.w, left.h, 6);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(left.x + left.w * 0.65, left.y + left.h * 0.28);
      ctx.lineTo(left.x + left.w * 0.30, left.y + left.h * 0.50);
      ctx.lineTo(left.x + left.w * 0.65, left.y + left.h * 0.72);
      ctx.closePath();
      ctx.stroke();

      // Right control box + hand-drawn right triangle
      ctx.fillStyle = (keys.right || pointerRight) ? "rgba(72, 181, 174, 0.25)" : "rgba(255,255,255,0.6)";
      ctx.beginPath();
      ctx.roundRect(right.x, right.y, right.w, right.h, 6);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(right.x + right.w * 0.35, right.y + right.h * 0.28);
      ctx.lineTo(right.x + right.w * 0.70, right.y + right.h * 0.50);
      ctx.lineTo(right.x + right.w * 0.35, right.y + right.h * 0.72);
      ctx.closePath();
      ctx.stroke();

      ctx.restore();
    }

    function drawBackgroundAndHUD() {
      // Clean white paper background
      ctx.fillStyle = "#fdfdfb";
      ctx.fillRect(0, 0, W, H);

      // Top title banner matching hand-drawn header
      ctx.save();
      ctx.translate(22, 38);
      ctx.rotate(-0.02);
      ctx.font = `bold ${Math.min(34, Math.max(20, W * 0.045))}px "Comic Sans MS", "Chalkboard SE", cursive, sans-serif`;
      ctx.fillStyle = "#7b4bb7";
      ctx.fillText("Dodge the asteroid", 0, 0);
      ctx.restore();

      // Thin blue notebook rule line under title
      ctx.strokeStyle = "#b8e0e6";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 54);
      ctx.lineTo(W, 48);
      ctx.stroke();

      // Score readout
      ctx.font = 'bold 20px "Comic Sans MS", "Chalkboard SE", sans-serif';
      ctx.fillStyle = "#2b7a78";
      ctx.fillText(`Score: ${Math.floor(score)}   Best: ${bestScore}`, 22, 82);

      // Hand-drawn wavy ground line at bottom
      const gy = getGroundY();
      ctx.strokeStyle = "#4a4642";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, gy + 8);
      ctx.quadraticCurveTo(W * 0.25, gy - 4, W * 0.45, gy + 6);
      ctx.quadraticCurveTo(W * 0.72, gy - 10, W, gy - 22);
      ctx.stroke();
    }

    function update(dt) {
      if (!gameRunning) return;

      const prevMilestone = Math.floor(score / 10);
      score += dt * 5;
      if (Math.floor(score / 10) > prevMilestone) {
        playTone(680, "sine", 0.14, 0.08);
      }

      let dir = 0;
      if (keys.left || pointerLeft) dir -= 1;
      if (keys.right || pointerRight) dir += 1;

      player.x += dir * player.speed * dt;
      const minX = player.r + 16;
      const maxX = W - player.r - 16;
      player.x = Math.max(minX, Math.min(maxX, player.x));

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnAsteroid();
        const interval = Math.max(0.28, 0.95 - score * 0.012);
        spawnTimer = interval * (0.75 + Math.random() * 0.5);
      }

      const gy = getGroundY();
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.y += a.vy * dt;

        // Circle collision check (slightly forgiving hitbox for kids)
        const dx = a.x - player.x;
        const dy = a.y - player.y;
        const hitDist = (a.r + player.r) * 0.78;
        if (dx * dx + dy * dy < hitDist * hitDist) {
          gameOver();
          return;
        }

        if (a.y - a.r > gy + 20) {
          asteroids.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 320 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function loop(timestamp) {
      const dt = Math.min(0.05, (timestamp - lastTime) / 1000 || 0.016);
      lastTime = timestamp;
      const t = timestamp / 1000;

      update(dt);
      updateParticles(dt);

      drawBackgroundAndHUD();
      for (const a of asteroids) drawAsteroid(a, t);
      if (gameRunning || particles.length === 0) drawPlayer(t);
      drawParticles();
      drawSketchControls();

      requestAnimationFrame(loop);
    }

    // Keyboard controls
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      if ((e.key === " " || e.key === "Enter") && !gameRunning) resetGame();
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    });

    // Multi-touch & mouse controls on canvas
    function updatePointerState(e) {
      pointerLeft = false;
      pointerRight = false;
      const { left, right } = getButtonRects();
      const points = e.touches ? Array.from(e.touches) : (e.buttons ? [e] : []);

      for (const pt of points) {
        const px = pt.clientX;
        const py = pt.clientY;
        const pad = 28;
        if (px >= left.x - pad && px <= left.x + left.w + pad && py >= left.y - pad && py <= left.y + left.h + pad) {
          pointerLeft = true;
        } else if (px >= right.x - pad && px <= right.x + right.w + pad && py >= right.y - pad && py <= right.y + right.h + pad) {
          pointerRight = true;
        } else if (py > H * 0.5) {
          // Also allow tapping left/right half of lower screen for younger kids
          if (px < W / 2) pointerLeft = true;
          else pointerRight = true;
        }
      }
    }

    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); updatePointerState(e); }, { passive: false });
    canvas.addEventListener("touchmove", (e) => { e.preventDefault(); updatePointerState(e); }, { passive: false });
    canvas.addEventListener("touchend", (e) => { e.preventDefault(); updatePointerState(e); }, { passive: false });
    canvas.addEventListener("mousedown", updatePointerState);
    canvas.addEventListener("mousemove", updatePointerState);
    window.addEventListener("mouseup", () => { pointerLeft = false; pointerRight = false; });

    startBtn.addEventListener("click", resetGame);
    shipToggleBtn.addEventListener("click", () => {
      shipStyle = (shipStyle + 1) % 2;
      shipToggleBtn.textContent = shipStyle === 0 ? "Ship: Teal" : "Ship: Purple";
      playTone(440, "triangle", 0.1, 0.08);
    });
    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? "Sound: ON" : "Sound: OFF";
    });

    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
